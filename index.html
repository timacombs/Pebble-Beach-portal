<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pebble Beach — Order Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sand:#F5F0E8;--deep:#1A1A14;--pine:#2C4A3E;--pine-light:#3D6B5A;
  --gold:#B8965A;--gold-light:#D4B078;--fog:#E8E4DC;--mist:#F0EDE7;
  --text:#1A1A14;--text-mid:#4A4A3E;--text-soft:#7A7A6E;--border:#D8D4CC;
  --amber-bg:#FDF6E7;--amber-text:#7A5C1E;--amber-border:#E8C87A;
  --green-bg:#EDF4F0;--green-text:#2C4A3E;--green-border:#A8C8B8;
  --blue-bg:#EEF2F8;--blue-text:#2A3F6A;--blue-border:#A8B8D8;
  --red-bg:#FDF0F0;--red-text:#6A2A2A;--red-border:#D8A8A8;
}
body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--text);min-height:100vh;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--deep);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:0;}
.login-card{width:400px;padding:56px 48px;background:var(--sand);position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pine),var(--gold));}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--text-soft);margin-bottom:48px;}
.login-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--deep);line-height:1.2;margin-bottom:8px;}
.login-sub{font-size:13px;color:var(--text-soft);margin-bottom:40px;font-weight:300;}
.login-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-soft);margin-bottom:8px;display:block;}
.login-input{width:100%;padding:12px 16px;background:var(--mist);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--deep);outline:none;transition:border-color 0.2s;margin-bottom:12px;}
.login-input:focus{border-color:var(--pine);}
.login-btn{width:100%;margin-top:12px;padding:14px;background:var(--pine);color:var(--sand);font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;border:none;cursor:pointer;transition:background 0.2s;}
.login-btn:hover{background:var(--pine-light);}
.login-error{font-size:12px;color:#8B2E2E;margin-top:12px;display:none;}
.login-footer{font-size:11px;color:rgba(255,255,255,0.3);margin-top:32px;letter-spacing:0.05em;}

/* PORTAL */
#portal{display:none;}
.topbar{background:var(--deep);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;}
.topbar-brand{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:0.25em;text-transform:uppercase;color:var(--sand);display:flex;align-items:center;gap:16px;}
.topbar-brand::after{content:'';width:1px;height:16px;background:rgba(255,255,255,0.2);}
.topbar-sub{font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.08em;color:rgba(255,255,255,0.5);font-weight:300;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.role-badge{font-size:11px;letter-spacing:0.08em;color:var(--gold);text-transform:uppercase;}
.logout-btn{font-size:11px;padding:6px 16px;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.5);background:transparent;cursor:pointer;letter-spacing:0.06em;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
.logout-btn:hover{border-color:rgba(255,255,255,0.5);color:white;}
.avatar-circle{width:32px;height:32px;border-radius:50%;background:var(--pine);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--sand);letter-spacing:0.05em;}

.tabs-bar{background:var(--deep);border-top:1px solid rgba(255,255,255,0.08);padding:0 40px;display:flex;gap:0;overflow-x:auto;}
.tab{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;padding:14px 20px;color:rgba(255,255,255,0.4);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;font-weight:300;}
.tab:hover{color:rgba(255,255,255,0.7);}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

.main{padding:40px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px;}
.stat-card{background:var(--mist);border:1px solid var(--border);padding:20px 24px;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;line-height:1;color:var(--deep);}
.stat-num.amber{color:var(--amber-text);}
.stat-num.green{color:var(--green-text);}
.stat-num.blue{color:var(--blue-text);}
.stat-lbl{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-soft);margin-top:6px;}

.section-head{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-soft);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}

.order-card{background:var(--mist);border:1px solid var(--border);margin-bottom:8px;transition:border-color 0.2s;}
.order-card:hover{border-color:var(--text-soft);}
.order-card.action-needed{border-left:3px solid var(--gold);}
.order-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;cursor:pointer;}
.order-left{display:flex;align-items:center;gap:20px;}
.order-num{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--deep);}
.order-meta{display:flex;flex-direction:column;gap:2px;}
.order-rsk{font-size:11px;color:var(--text-soft);letter-spacing:0.04em;}
.order-note{font-size:12px;color:var(--text-mid);font-style:italic;}
.order-shop-tag{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;background:var(--fog);border:1px solid var(--border);color:var(--text-soft);}
.order-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;}
.order-date{font-size:12px;color:var(--text-soft);}
.progress-text{font-size:11px;color:var(--text-soft);}
.status-pill{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:4px 12px;font-weight:500;}
.s-complete{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border);}
.s-action{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border);}
.s-pending{background:var(--fog);color:var(--text-soft);border:1px solid var(--border);}
.s-review{background:var(--blue-bg);color:var(--blue-text);border:1px solid var(--blue-border);}
.chevron{font-size:10px;color:var(--text-soft);transition:transform 0.2s;}
.chevron.open{transform:rotate(90deg);}

.order-body{display:none;border-top:1px solid var(--border);padding:24px;}
.order-body.open{display:block;}
.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.body-col{}

.stages{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.stage-row{display:flex;align-items:center;gap:12px;}
.stage-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:transparent;}
.stage-dot.done{background:var(--pine);border-color:var(--pine);color:var(--sand);}
.stage-dot.needs-action{background:var(--amber-bg);border-color:var(--amber-border);}
.stage-dot.admin-click{cursor:pointer;}
.stage-dot.admin-click:hover:not(.done){background:var(--fog);}
.stage-label{font-size:13px;color:var(--text);}
.stage-label.done{color:var(--text-soft);text-decoration:line-through;}
.stage-label.needs-action{color:var(--amber-text);font-weight:500;}

.divider{height:1px;background:var(--border);margin:20px 0;}
.sub-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-soft);margin-bottom:12px;}

.proof-section,.po-section,.qc-section,.flag-section{background:var(--fog);border:1px solid var(--border);padding:20px;margin-bottom:12px;}
.proof-file{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pine);cursor:pointer;margin-bottom:14px;}
.proof-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn{font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.06em;padding:10px 20px;cursor:pointer;border:1px solid;transition:all 0.15s;text-transform:uppercase;background:transparent;}
.btn-approve{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);}
.btn-approve:hover{background:var(--green-text);color:var(--sand);}
.btn-changes{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border);}
.btn-changes:hover{background:var(--amber-text);color:var(--sand);}
.btn-admin{color:var(--text-mid);border-color:var(--border);}
.btn-admin:hover{background:var(--deep);color:var(--sand);border-color:var(--deep);}
.btn-primary{background:var(--pine);color:var(--sand);border-color:var(--pine);}
.btn-primary:hover{background:var(--pine-light);}
.btn-danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red-border);}
.btn-danger:hover{background:var(--red-text);color:var(--sand);}
.btn-gold{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border);}
.btn-gold:hover{background:var(--gold);color:var(--sand);}

.po-input-row{display:flex;gap:10px;align-items:center;}
.po-input,.form-input,.form-select{flex:1;padding:10px 14px;background:var(--sand);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--deep);outline:none;}
.po-input:focus,.form-input:focus,.form-select:focus{border-color:var(--pine);}
.form-select{cursor:pointer;}

.qc-checks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.qc-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.qc-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--pine);cursor:pointer;}
.qc-row label{cursor:pointer;color:var(--text);}

.flag-box{background:var(--red-bg);border:1px solid var(--red-border);padding:12px 16px;margin-bottom:12px;font-size:12px;color:var(--red-text);letter-spacing:0.03em;}
.custom-flag{background:var(--red-bg);border:2px solid var(--red-border);padding:10px 16px;font-size:12px;font-weight:500;color:var(--red-text);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:12px;}

.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}

/* ADD ORDER MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--sand);width:600px;max-height:85vh;overflow-y:auto;position:relative;}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pine),var(--gold));}
.modal-head{padding:32px 36px 20px;border-bottom:1px solid var(--border);}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--deep);}
.modal-body{padding:24px 36px;}
.modal-footer{padding:20px 36px;border-top:1px solid var(--border);display:flex;gap:12px;justify-content:flex-end;}
.form-row{margin-bottom:16px;}
.form-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-soft);margin-bottom:6px;display:block;}
.form-input,.form-select{width:100%;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--sand);font-size:12px;letter-spacing:0.06em;padding:12px 24px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;}

.filter-row{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap;}
.filter-select{padding:8px 14px;background:var(--mist);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--pine);}
.results-count{font-size:12px;color:var(--text-soft);margin-left:auto;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Swannies Golf</div>
    <div class="login-title">Pebble Beach<br>Order Portal</div>
    <div class="login-sub">Secure access for authorized users</div>
    <label class="login-label">Password</label>
    <input class="login-input" type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Enter Portal</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
  <div class="login-footer">© 2026 Swannies Golf — Confidential</div>
</div>

<!-- ADD ORDER MODAL -->
<div class="modal-overlay" id="add-order-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Add New Order</div>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">Order #</label>
          <input class="form-input" id="new-order-num" placeholder="e.g. 78900" type="text">
        </div>
        <div class="form-row">
          <label class="form-label">RSK #</label>
          <input class="form-input" id="new-order-rsk" placeholder="e.g. RSK 105700" type="text">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">Shop</label>
          <select class="form-select" id="new-order-shop">
            <option value="lone-cypress">Lone Cypress</option>
            <option value="spyglass">Spyglass</option>
            <option value="juniors">Juniors</option>
            <option value="del-monte">Del Monte</option>
            <option value="the-hay">The Hay</option>
            <option value="us-open">US Open</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">Due Date</label>
          <input class="form-input" id="new-order-date" type="date">
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Notes / Description</label>
        <input class="form-input" id="new-order-note" placeholder="e.g. Custom Vandyke Hoodie" type="text">
      </div>
      <div class="form-row">
        <label class="form-label">PO Number (if known)</label>
        <input class="form-input" id="new-order-po" placeholder="e.g. 567664-410" type="text">
      </div>
      <div class="form-row">
        <label class="form-label">Is this a custom order? (No LID discount applies)</label>
        <select class="form-select" id="new-order-custom">
          <option value="yes">Yes — Custom (NO 15% LID discount)</option>
          <option value="no">No — Standard</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Initial Status</label>
        <select class="form-select" id="new-order-status">
          <option value="pending">Upcoming</option>
          <option value="action">Action needed</option>
          <option value="review">In production</option>
          <option value="complete">Complete</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-admin" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewOrder()">Add Order</button>
    </div>
  </div>
</div>

<!-- PORTAL -->
<div id="portal">
  <div class="topbar">
    <div class="topbar-brand">
      Swannies Golf
      <span class="topbar-sub">Pebble Beach Order Portal</span>
    </div>
    <div class="topbar-right">
      <span class="role-badge" id="role-badge">Pebble Beach</span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
      <div class="avatar-circle" id="avatar">PB</div>
    </div>
  </div>
  <div class="tabs-bar" id="tabs-bar"></div>
  <div class="main" id="main-content"></div>
</div>

<div class="toast" id="toast"></div>

      {num:'79626',date:'Jun 15, 2026',note:'Hats only',status:'action',custom:false,stages:[{l:'Inventory picked & secured',d:false},{l:'Order placed on hold',d:false},{l:'Logo proof created',d:false},{l:'Proof approval needed',d:false,a:true},{l:'PO supplied',d:false},{l:'PO validated',d:false},{l:'Release hold, embroider, tag & ship',d:false}],qc:{inv:false,emb:false,tags:false,qci:false,packed:false}},

    ]
  },
  'us-open':{
    label:'US Open',
    orders:[
      {num:'69236',rsk:'RSK 98968',date:'Mar 1, 2026',status:'complete',custom:false,stages:[{l:'Logo proof mocks completed',d:true},{l:'Logo proofs approved',d:true},{l:'PO supplied',d:true}]},
      {num:'69239',rsk:'RSK 98976',date:'Apr 1, 2026',status:'complete',custom:false,stages:[{l:'Logo proof mocks completed',d:true},{l:'Logo proofs approved',d:true},{l:'PO supplied',d:true}]},
      {num:'75293',rsk:'RSK 103317',date:'Jun 1, 2026',note:"Men's Custom Pic, Vandyke & Owen",status:'complete',po:'567195-485',custom:true,stages:[{l:'Logo proof mocks completed',d:true},{l:'Logo proofs approved',d:true},{l:'Strike-offs approved',d:true},{l:'PO supplied',d:true}]},
      {num:'76060',rsk:'RSK 103653',date:'Jun 1, 2026',note:"Jr's Custom Vandyke",status:'complete',custom:true,stages:[{l:'Logo proof mocks completed',d:true},{l:'Logo proofs approved',d:true},{l:'Strike-offs approved',d:true},{l:'PO supplied',d:true}]}

function getAllOrders() {
  let all = [];
  Object.entries(shops).forEach(([key, shop]) => {
    shop.orders.forEach((order, idx) => {
      all.push({...order, shopKey: key, shopLabel: shop.label, shopIdx: idx});
    });
  });
  return all;
}

function getShopStats(shopKey) {
  const orders = shopKey === 'all' ? getAllOrders() : shops[shopKey].orders;
  return {
    total: orders.length,
    action: orders.filter(o=>o.status==='action').length,
    po: orders.filter(o=>o.po).length,
    pending: orders.filter(o=>o.status==='pending'||o.status==='review').length
  };
}

function tryLogin() {
  const val = document.getElementById('pw-input').value;
  if(val === ADMIN_PASS) {
    isAdmin = true;
    launchPortal();
  } else if(val.toLowerCase() === PB_PASS) {
    isAdmin = false;
    launchPortal();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function launchPortal() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  document.getElementById('role-badge').textContent = isAdmin ? 'Admin — Swannies' : 'Pebble Beach';
  document.getElementById('avatar').textContent = isAdmin ? 'SW' : 'PB';
  buildTabs();
  renderMain();
}

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('portal').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-error').style.display = 'none';
  currentShop = 'all';
  openCards = {};
}

function buildTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = '';
  const tabDefs = [
    {key:'all', label:'All Orders'},
    ...Object.entries(shops).map(([k,s])=>({key:k, label:s.label}))
  ];
  tabDefs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.key === currentShop ? ' active' : '');
    el.textContent = t.label;
    el.onclick = () => {
      currentShop = t.key;
      openCards = {};
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      renderMain();
    };
    bar.appendChild(el);
  });
}

function renderMain() {
  const stats = getShopStats(currentShop);
  const label = currentShop === 'all' ? 'All Orders' : shops[currentShop].label + ' — Orders';

  let html = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${stats.total}</div><div class="stat-lbl">Total orders</div></div>
      <div class="stat-card"><div class="stat-num amber">${stats.action}</div><div class="stat-lbl">Need action</div></div>
      <div class="stat-card"><div class="stat-num green">${stats.po}</div><div class="stat-lbl">POs received</div></div>
      <div class="stat-card"><div class="stat-num blue">${stats.pending}</div><div class="stat-lbl">In progress</div></div>
    </div>`;

  if(currentShop === 'all') {
    html += `<div class="filter-row">
      <select class="filter-select" onchange="allOrdersFilter=this.value;renderMain()">
        <option value="all" ${allOrdersFilter==='all'?'selected':''}>All statuses</option>
        <option value="action" ${allOrdersFilter==='action'?'selected':''}>Action needed</option>
        <option value="pending" ${allOrdersFilter==='pending'?'selected':''}>Upcoming</option>
        <option value="review" ${allOrdersFilter==='review'?'selected':''}>In production</option>
        <option value="complete" ${allOrdersFilter==='complete'?'selected':''}>Complete</option>
      </select>
      ${isAdmin ? `<button class="btn btn-primary" onclick="openModal()">+ Add order</button>` : ''}
    </div>`;
  } else if(isAdmin) {
    html += `<div class="filter-row"><button class="btn btn-primary" onclick="openModal()">+ Add order</button></div>`;
  }

  html += `<div class="section-head">${label}</div><div id="orders-list"></div>`;
  document.getElementById('main-content').innerHTML = html;
  renderOrders();
}

function renderOrders() {
  const list = document.getElementById('orders-list');
  if(!list) return;

  let orders = [];
  if(currentShop === 'all') {
    orders = getAllOrders().filter(o => allOrdersFilter === 'all' || o.status === allOrdersFilter);
  } else {
    orders = shops[currentShop].orders.map((o,i)=>({...o, shopKey:currentShop, shopLabel:shops[currentShop].label, shopIdx:i}));
  }

  list.innerHTML = '';

  if(orders.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-soft);font-size:14px;">No orders found.</div>';
    return;
  }

  orders.forEach((order, displayIdx) => {
    const shopKey = order.shopKey || currentShop;
    const orderIdx = order.shopIdx !== undefined ? order.shopIdx : displayIdx;
    const cardKey = shopKey + '_' + orderIdx;
    const isOpen = openCards[cardKey];
    const doneCount = order.stages.filter(s=>s.d).length;
    const total = order.stages.length;

    const statusMap = {
      complete:['Complete','s-complete'],
      action:['Action needed','s-action'],
      pending:['Upcoming','s-pending'],
      review:['In production','s-review']
    };
    const [slabel,sclass] = statusMap[order.status]||['—','s-pending'];

    const card = document.createElement('div');
    card.className = 'order-card' + (order.status==='action'?' action-needed':'');

    const stagesHtml = order.stages.map((s,si) => {
      const dotClass = s.d?'done':(s.a?'needs-action':'');
      const adminExtra = isAdmin ? ` admin-click" onclick="toggleStage('${shopKey}',${orderIdx},${si})"` : '"';
      const labelClass = s.d?'done':(s.a?'needs-action':'');
      return `<div class="stage-row">
        <div class="stage-dot ${dotClass}${isAdmin?' admin-click':''}" ${isAdmin?`onclick="toggleStage('${shopKey}',${orderIdx},${si})"`:''} style="${isAdmin?'cursor:pointer':''}">
          ${s.d?'✓':''}
        </div>
        <span class="stage-label ${labelClass}">${s.l}</span>
      </div>`;
    }).join('');

    const proofHtml = order.proof ? `
      <div class="proof-section">
        <div class="sub-label">Logo coloring proof</div>
        <div class="proof-file">📄 ${order.proof}</div>
        <div class="proof-actions">
          <button class="btn btn-approve" onclick="approveProof('${order.num}','${shopKey}',${orderIdx})">Approve proof</button>
          <button class="btn btn-changes" onclick="requestChanges('${order.num}','${shopKey}')">Request changes</button>
        </div>
      </div>` : '';

    const customFlag = order.custom ? `<div class="custom-flag">⚠ Custom order — NO 15% LID discount applies</div>` : '';

    const poHtml = (order.status==='action'||order.status==='pending') ? `
      <div class="po-section">
        ${customFlag}
        <div class="sub-label">Submit PO number</div>
        <div class="po-input-row">
          <input class="po-input" type="text" id="po-${shopKey}-${orderIdx}" placeholder="e.g. 567664-410" value="${order.po||''}">
          <button class="btn btn-primary" onclick="submitPO('${order.num}','${shopKey}',${orderIdx})">Submit PO</button>
        </div>
      </div>` : (order.po && order.status!=='pending') ? `<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">PO on file: <strong style="color:var(--text)">${order.po}</strong>${order.custom?` <span style="color:var(--red-text);font-size:11px;">(Custom — no LID)</span>`:''}</div>` : '';

    const qcData = order.qc || {inv:false,emb:false,tags:false,qci:false,packed:false};
    const qcHtml = isAdmin ? `
      <div class="qc-section">
        <div class="sub-label">Warehouse QC checklist</div>
        <div class="qc-checks">
          <div class="qc-row"><input type="checkbox" id="qc-inv-${shopKey}-${orderIdx}" ${qcData.inv?'checked':''} onchange="updateQC('${shopKey}',${orderIdx},'inv',this.checked)"><label for="qc-inv-${shopKey}-${orderIdx}">Inventory picked & secured</label></div>
          <div class="qc-row"><input type="checkbox" id="qc-emb-${shopKey}-${orderIdx}" ${qcData.emb?'checked':''} onchange="updateQC('${shopKey}',${orderIdx},'emb',this.checked)"><label for="qc-emb-${shopKey}-${orderIdx}">Embroidery completed</label></div>
          <div class="qc-row"><input type="checkbox" id="qc-tags-${shopKey}-${orderIdx}" ${qcData.tags?'checked':''} onchange="updateQC('${shopKey}',${orderIdx},'tags',this.checked)"><label for="qc-tags-${shopKey}-${orderIdx}">Hang tags applied (orders 50+ units)</label></div>
          <div class="qc-row"><input type="checkbox" id="qc-qci-${shopKey}-${orderIdx}" ${qcData.qci?'checked':''} onchange="updateQC('${shopKey}',${orderIdx},'qci',this.checked)"><label for="qc-qci-${shopKey}-${orderIdx}">QC inspection passed</label></div>
          <div class="qc-row"><input type="checkbox" id="qc-packed-${shopKey}-${orderIdx}" ${qcData.packed?'checked':''} onchange="updateQC('${shopKey}',${orderIdx},'packed',this.checked)"><label for="qc-packed-${shopKey}-${orderIdx}">Packed & ready to ship</label></div>
        </div>
        <div class="admin-actions">
          <button class="btn btn-admin" onclick="uploadProof('${shopKey}',${orderIdx})">Upload proof</button>
          <button class="btn btn-admin" onclick="releaseHold('${shopKey}',${orderIdx})">Release hold</button>
          <button class="btn btn-admin" onclick="showToast('Notes saved.')">Add notes</button>
          <button class="btn btn-danger" onclick="flagMismatch('${order.num}')">Flag PO mismatch</button>
        </div>
      </div>` : '';

    card.innerHTML = `
      <div class="order-header" onclick="toggleCard('${shopKey}',${orderIdx})">
        <div class="order-left">
          <div class="order-num">Order #${order.num}</div>
          <div class="order-meta">
            ${order.rsk?`<span class="order-rsk">${order.rsk}</span>`:''}
            ${order.note?`<span class="order-note">${order.note}</span>`:''}
            ${currentShop==='all'?`<span class="order-shop-tag">${order.shopLabel}</span>`:''}
          </div>
        </div>
        <div class="order-right">
          <span class="order-date">Due ${order.date}</span>
          <span class="progress-text">${doneCount}/${total} steps</span>
          <span class="status-pill ${sclass}">${slabel}</span>
          <span class="chevron ${isOpen?'open':''}">▶</span>
        </div>
      </div>
      <div class="order-body ${isOpen?'open':''}">
        <div class="body-grid">
          <div class="body-col">
            <div class="sub-label">Order progress</div>
            <div class="stages">${stagesHtml}</div>
          </div>
          <div class="body-col">
            ${proofHtml}
            ${poHtml}
            ${qcHtml}
          </div>
        </div>
      </div>`;

    list.appendChild(card);
  });
}

function toggleCard(shopKey, orderIdx) {
  const key = shopKey + '_' + orderIdx;
  openCards[key] = !openCards[key];
  renderOrders();
}

function toggleStage(shopKey, orderIdx, stageIdx) {
  shops[shopKey].orders[orderIdx].stages[stageIdx].d = !shops[shopKey].orders[orderIdx].stages[stageIdx].d;
  renderOrders();
}

function updateQC(shopKey, orderIdx, field, val) {
  if(!shops[shopKey].orders[orderIdx].qc) shops[shopKey].orders[orderIdx].qc = {};
  shops[shopKey].orders[orderIdx].qc[field] = val;
}

async function approveProof(orderNum, shopKey, orderIdx) {
  showToast('Submitting approval...');
  try {
    await fetch(FORMSPREE, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        type: 'PROOF APPROVED',
        order: orderNum,
        shop: shops[shopKey].label,
        message: `Order #${orderNum} — Logo coloring proof has been approved by Pebble Beach. Please proceed with embroidery.`,
        _subject: `[PB Portal] Proof Approved — Order #${orderNum}`
      })
    });
    showToast('Proof approved — Jen, Tim & Serafine have been notified.');
  } catch(e) {
    showToast('Approved! (Notification may be delayed.)');
  }
}

async function requestChanges(orderNum, shopKey) {
  const notes = prompt('Please describe the changes needed:');
  if(!notes) return;
  try {
    await fetch(FORMSPREE, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        type: 'PROOF CHANGES REQUESTED',
        order: orderNum,
        shop: shops[shopKey].label,
        changes: notes,
        _subject: `[PB Portal] Changes Requested — Order #${orderNum}`
      })
    });
    showToast('Change request submitted — team has been notified.');
  } catch(e) {
    showToast('Request submitted.');
  }
}

async function submitPO(orderNum, shopKey, orderIdx) {
  const val = document.getElementById(`po-${shopKey}-${orderIdx}`)?.value.trim();
  if(!val) { showToast('Please enter a PO number.'); return; }
  try {
    await fetch(FORMSPREE, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        type: 'PO SUBMITTED',
        order: orderNum,
        shop: shops[shopKey].label,
        po_number: val,
        custom_order: shops[shopKey].orders[orderIdx].custom ? 'YES — No LID discount' : 'No',
        _subject: `[PB Portal] PO Submitted — Order #${orderNum} — PO ${val}`
      })
    });
    shops[shopKey].orders[orderIdx].po = val;
    showToast(`PO ${val} submitted — Tim & Serafine have been notified.`);
  } catch(e) {
    showToast('PO submitted.');
  }
}

async function flagMismatch(orderNum) {
  const notes = prompt('Describe the mismatch (size, qty, pricing):');
  if(!notes) return;
  try {
    await fetch(FORMSPREE, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        type: 'PO MISMATCH FLAGGED',
        order: orderNum,
        mismatch_details: notes,
        _subject: `[PB Portal] ⚠ PO Mismatch — Order #${orderNum}`
      })
    });
    showToast('Mismatch flagged — team alerted.');
  } catch(e) {
    showToast('Flagged.');
  }
}

function uploadProof(shopKey, orderIdx) {
  const filename = prompt('Enter proof filename (e.g. proof_78879.pdf):');
  if(!filename) return;
  shops[shopKey].orders[orderIdx].proof = filename;
  showToast('Proof uploaded — PB can now review and approve.');
  renderOrders();
}

function releaseHold(shopKey, orderIdx) {
  showToast('Hold released — order is active.');
}

function openModal() {
  document.getElementById('add-order-modal').classList.add('open');
  document.getElementById('new-order-shop').value = currentShop !== 'all' ? currentShop : 'lone-cypress';
}

function closeModal() {
  document.getElementById('add-order-modal').classList.remove('open');
}

function saveNewOrder() {
  const num = document.getElementById('new-order-num').value.trim();
  const rsk = document.getElementById('new-order-rsk').value.trim();
  const shopKey = document.getElementById('new-order-shop').value;
  const dateRaw = document.getElementById('new-order-date').value;
  const note = document.getElementById('new-order-note').value.trim();
  const po = document.getElementById('new-order-po').value.trim();
  const custom = document.getElementById('new-order-custom').value === 'yes';
  const status = document.getElementById('new-order-status').value;

  if(!num) { showToast('Order number is required.'); return; }

  const dateFormatted = dateRaw ? new Date(dateRaw + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : 'TBD';

  const newOrder = {
    num, rsk, date: dateFormatted, note, po: po || undefined,
    custom, status,
    stages: [...defaultStages.map(s=>({...s}))],
    qc:{inv:false,emb:false,tags:false,qci:false,packed:false}
  };

  shops[shopKey].orders.push(newOrder);
  closeModal();
  showToast(`Order #${num} added to ${shops[shopKey].label}.`);

  if(currentShop !== 'all' && currentShop !== shopKey) {
    currentShop = shopKey;
    buildTabs();
  }
  renderMain();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500);
}
</script>
